name = "liudao-reward-check"
main = "worker.js"
compatibility_date = "2024-01-01"

# Cron Triggers - 每10分钟准时运行
[triggers]
crons = ["*/10 * * * *"]

# 环境变量（敏感信息用 wrangler secret put 设置）
# wrangler secret put WXPUSHER_SPT
# wrangler secret put WXPUSHER_APP_TOKEN  (可选)
# wrangler secret put WXPUSHER_UIDS       (可选)
# wrangler secret put DATA_URL            (可选，默认从GitHub读取)